<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEE SHOP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#171717;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:45px 22px 30px;
    text-align:center;
}

/* LOGO */

.logo{
    width:82px;
    height:82px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#ff2b91;
    color:white;

    font-size:20px;
    font-weight:400;
    letter-spacing:1px;

    box-shadow:0 8px 30px rgba(255,43,145,.18);
}

h1{
    margin-top:18px;

    font-size:25px;
    font-weight:400;
    letter-spacing:2px;
}

.bio{
    margin-top:8px;

    color:#777;
    font-size:13px;
    font-weight:400;
    line-height:1.7;
}


/* SECTION TITLE */

.title{
    margin-top:38px;
    margin-bottom:15px;

    color:#ff2b91;

    font-size:11px;
    font-weight:400;

    letter-spacing:2px;
}


/* GAME BUTTON */

.game{
    position:relative;

    display:flex;
    align-items:center;

    gap:15px;

    width:100%;

    padding:15px;

    margin:12px 0;

    background:#ffffff;

    border:1px solid #eeeeee;
    border-radius:15px;

    text-decoration:none;
    color:#171717;

    transition:.25s;
}

.game:hover{
    transform:translateY(-3px);

    border-color:#ff2b91;

    box-shadow:0 10px 30px rgba(255,43,145,.12);
}

.icon{
    width:48px;
    height:48px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#fff0f7;

    font-size:23px;
}

.game-info{
    flex:1;
    text-align:left;
}

.game-name{
    font-size:15px;
    font-weight:400;
    letter-spacing:.3px;
}

.game-desc{
    margin-top:5px;

    color:#999;

    font-size:11px;
    font-weight:400;
}

.arrow{
    color:#ff2b91;
    font-size:22px;
    font-weight:400;
}


/* SOCIAL BUTTON */

.social{
    display:block;

    width:100%;

    padding:15px;

    margin:10px 0;

    background:#ffffff;

    border:1px solid #eeeeee;
    border-radius:13px;

    color:#333;

    text-decoration:none;

    font-size:13px;
    font-weight:400;

    transition:.25s;
}

.social:hover{
    transform:translateY(-2px);

    border-color:#ff2b91;

    color:#ff2b91;

    box-shadow:0 8px 25px rgba(255,43,145,.10);
}


/* WHATSAPP */

.whatsapp{
    display:block;

    width:100%;

    padding:15px;

    margin:10px 0;

    background:#ff2b91;

    border:1px solid #ff2b91;

    border-radius:13px;

    color:white;

    text-decoration:none;

    font-size:13px;
    font-weight:400;

    transition:.25s;
}

.whatsapp:hover{
    background:#ff4ca5;

    transform:translateY(-2px);

    box-shadow:0 10px 25px rgba(255,43,145,.20);
}


/* FOOTER */

.footer{
    margin-top:35px;

    color:#aaa;

    font-size:10px;
    font-weight:400;

    letter-spacing:1px;
}


/* MOBILE */

@media(max-width:400px){

    .container{
        padding:35px 17px 25px;
    }

    .logo{
        width:75px;
        height:75px;
    }

    h1{
        font-size:23px;
    }
}
</style>
</head>


<body>

<div class="container">


    <!-- LOGO -->

    <div class="logo">
        CEE
    </div>


    <h1>
        CEE SHOP
    </h1>


    <p class="bio">
        GAME ACCOUNT STORE 🎮<br>
        eFootball & Free Fire
    </p>



    <!-- GAME -->

    <div class="title">

    </div>

    <a
        class="game"
        href="https://wa.me/628134809180?text=Halo%20CEE%20SHOP,%20saya%20ingin%20melihat%20akun%20eFootball."
        target="_blank"
    >

        <div class="icon">

        <div class="game-info">

        <div class="icon">
            🔥
        </div>

        <div class="game-info">

            <div class="game-name">

            </div>

            <div class="game-desc">
                Jual beli akun Free Fire
            </div>

        </div>

        <div class="arrow">
            ›
        </div>

    </a>



    <!-- SOCIAL MEDIA -->

    <div class="title">
        SOCIAL MEDIA
    </div>


    <a
        class="social"
        href="https://www.tiktok.com/@ceeshop.id"
        target="_blank"
    >
        TikTok · @ceeshop.id
    </a>


    <a
        class="social"

    >
        Instagram · @ceeshop.id
    </a>


    <a
        class="whatsapp"

    <a
        class="social"

    </a>



    <div class="footer">
        CEE SHOP © 2026
    </div>


</div>

</body>
</html>
