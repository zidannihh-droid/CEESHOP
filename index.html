<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEE SHOP | Game Account Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:35px 20px;
    text-align:center;
}

/* LOGO */
.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#ff2b91;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:900;
    box-shadow:0 0 30px rgba(255,43,145,.35);
}

h1{
    margin-top:15px;
    font-size:25px;
}

.bio{
    color:#999;
    font-size:13px;
    margin-top:8px;
}

/* GAME */
.title{
    margin-top:35px;
    margin-bottom:15px;
    font-size:13px;
    color:#ff2b91;
    font-weight:bold;
    letter-spacing:1px;
}

.game{
    display:flex;
    align-items:center;
    gap:15px;
    background:#151515;
    border:1px solid #292929;
    padding:16px;
    margin:12px 0;
    border-radius:14px;
    text-decoration:none;
    color:white;
    transition:.2s;
}

.game:hover{
    transform:translateY(-3px);
    border-color:#ff2b91;
}

.icon{
    width:50px;
    height:50px;
    border-radius:12px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.game-info{
    text-align:left;
    flex:1;
}

.game-name{
    font-size:15px;
    font-weight:bold;
}

.game-desc{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.arrow{
    color:#ff2b91;
    font-size:20px;
}

/* SOSMED */
.social{
    display:block;
    background:#151515;
    border:1px solid #292929;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

.social:hover{
    border-color:#ff2b91;
}

.footer{
    margin-top:30px;
    color:#555;
    font-size:10px;
}
</style>
</head>

       target="_blank">

        <div class="icon">⚽</div>

            <div class="game-name">

       target="_blank">

            </div>
        </div>

        <div class="arrow">
            ›
        </div>

    <!-- SOSIAL MEDIA -->
    <div class="title">

    </div>


    <a class="social"
       href="https://www.tiktok.com/@ceeshop.id"

    </a>


    <a class="social"
       href="https://www.instagram.com/ceeshop.id"

    <a class="social"
